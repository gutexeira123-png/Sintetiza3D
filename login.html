<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinançasPRO – Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function() {
      var SITE_PASSWORD = 'Sintetiza2901';
      var gateKey = 'financaspro_access';
      if (sessionStorage.getItem(gateKey) !== 'granted') {
        var pwd = prompt('🔒 Site Privado\n\nDigite a senha de acesso:');
        if (pwd !== SITE_PASSWORD) {
          document.write('<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f0f1a;font-family:Inter,sans-serif;color:#e2e8f0;flex-direction:column;gap:12px;text-align:center;padding:24px"><h1 style="font-size:24px">🔒 Acesso Negado</h1><p style="color:#94a3b8;font-size:14px">Senha incorreta. Recarregue a página para tentar novamente.</p></div>');
          throw new Error('Access denied');
        }
        sessionStorage.setItem(gateKey, 'granted');
      }
    })();
  </script>
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="url(#authGrad)"/>
          <path d="M7 14h14M14 7v14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="authGrad" x1="0" y1="0" x2="28" y2="28">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">FinançasPRO</span>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Entrar</button>
        <button class="auth-tab" id="tabRegister">Criar conta</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <div class="input-password-wrap">
            <input type="password" id="loginPassword" class="form-input" placeholder="Sua senha" required />
            <button type="button" class="btn-show-password" id="toggleLoginPwd" aria-label="Mostrar senha">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" id="eyeIconLogin">
                <path d="M2 10C2 10 5 4 10 4s8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="auth-forgot">
          <button type="button" class="link-btn" id="forgotBtn">Esqueci minha senha</button>
        </div>
        <button type="submit" class="btn-primary btn-auth" id="loginBtn">
          Entrar na conta
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" style="display:none" novalidate>
        <div class="form-group">
          <label for="registerEmail">E-mail</label>
          <input type="email" id="registerEmail" class="form-input" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="registerPassword">Senha</label>
          <div class="input-password-wrap">
            <input type="password" id="registerPassword" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6" />
            <button type="button" class="btn-show-password" id="toggleRegisterPwd" aria-label="Mostrar senha">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" id="eyeIconRegister">
                <path d="M2 10C2 10 5 4 10 4s8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="registerConfirm">Confirmar senha</label>
          <input type="password" id="registerConfirm" class="form-input" placeholder="Repita a senha" required />
        </div>
        <button type="submit" class="btn-primary btn-auth" id="registerBtn">
          Criar conta
        </button>
      </form>

      <!-- Forgot password form -->
      <form id="forgotForm" class="auth-form" style="display:none" novalidate>
        <p class="auth-hint">Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>
        <div class="form-group">
          <label for="forgotEmail">E-mail</label>
          <input type="email" id="forgotEmail" class="form-input" placeholder="seu@email.com" required />
        </div>
        <button type="submit" class="btn-primary btn-auth">
          Enviar link
        </button>
        <button type="button" class="btn-secondary btn-auth" id="backToLoginBtn">
          Voltar ao login
        </button>
      </form>

      <div class="auth-message" id="authMessage"></div>

    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
